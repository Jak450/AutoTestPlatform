example.ai_study_notes:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: app_test
    username: root
    password: 123456
  redis:
    host: 127.0.0.1
    port: 6379
    password:
    database: 0
    timeout: 3000
    ttl: 300

agent:
  auth:
    jwt-secret: agent-test-platform-jwt-secret-2026-change-me
    jwt-expire-seconds: 86400
    allow-public-paths: /api/auth/login,/api/auth/logout
  file:
    base-dir: ./agent-data
    max-size-mb: 10
  llm:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-v4-flash
    temperature: 0.3
    timeout-seconds: 300
  run:
    max-rounds: 20
    run-timeout-seconds: 300

task:
  scheduler:
    enable:
      accessUserInfo: false   #控制定时任务开启
      collectECSMetricInfo: true
  cron:
    accessUserInfo: 0 */5 * * * *
    collectESCMetricInfo: 10000
  scope:

logging:
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      file-name-pattern: logs/app-%d{yyyy-MM-dd}.%i.log
  pattern:
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
  level:
    root: INFO
    org.example.ai_study_notes: DEBUG
    org.example.ai_study_notes.mapper: DEBUG
